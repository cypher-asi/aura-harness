[package]
name = "aura"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "aura"
path = "src/main.rs"

# `src/main.rs` only dispatches: the desktop window, or `aura-cli`.
[dependencies]
aura-cli = { path = "crates/surface/aura-cli" }
aura-desktop = { path = "crates/surface/aura-desktop", optional = true }
anyhow = { workspace = true }
clap = "4.5"
tokio = { workspace = true }
aura-config = { path = "crates/config/aura-config" }
mimalloc = { workspace = true }

# `aura` with no subcommand opens the desktop window. It needs Rust 1.88
# (wgpu); build with `--no-default-features` for servers, containers and
# the 1.85 MSRV check, where `aura` runs in the terminal instead.
[features]
default = ["desktop"]
desktop = ["dep:aura-desktop"]

[workspace]
resolver = "2"
members = [
    "crates/core/aura-core-modes",
    "crates/core/aura-core-permissions",
    "crates/core/aura-core-types",
    "crates/core/aura-core-auth",
    "crates/core/aura-core-protocol",
    "crates/config/aura-config",
    "crates/store/aura-store-snapshot",
    "crates/store/aura-store-record",
    "crates/store/aura-store-db",
    "crates/model/aura-model",
    "crates/context/aura-context-prompts",
    "crates/context/aura-context-compaction",
    "crates/context/aura-context-skills",
    "crates/context/aura-context-memory",
    "crates/plugin/aura-plugin-api",
    "crates/plugin/aura-plugin-hooks",
    "crates/plugin/aura-plugin-mcp",
    "crates/plugin/aura-plugin-connectors",
    "crates/plugin/aura-plugin",
    "crates/exec/aura-exec-traits",
    "crates/exec/aura-exec-domain-http",
    "crates/exec/aura-exec-tools",
    "crates/agent/aura-agent-subagent",
    "crates/agent/aura-agent-steering",
    "crates/agent/aura-agent-kernel",
    "crates/agent/aura-agent",
    "crates/agent/aura-agent-trace",
    "crates/gate/aura-gate-evidence",
    "crates/gate/aura-gate-route",
    "crates/gate/aura-gate-followup",
    "crates/gate/aura-gate-judge",
    "crates/gate/aura-gate-attempts",
    "crates/gate/aura-gate-compare",
    "crates/gate/aura-gate-lead",
    "crates/gate/aura-gate-live",
    "crates/gate/aura-gate",
    "crates/auth/aura-auth-kit",
    "crates/auth/aura-auth-zos",
    "crates/auth/aura-auth-chatgpt",
    "crates/auth/aura-auth-claude",
    "crates/auth/aura-auth-openrouter",
    "crates/auth/aura-auth",
    "crates/engine/aura-engine-automaton",
    "crates/engine/aura-engine-cloud",
    "crates/engine/aura-engine",
    "crates/ui/aura-ui",
    "crates/ui/aura-ui-terminal",
    "crates/surface/aura-app",
    "crates/surface/aura-node",
    "crates/surface/aura-cli",
    "crates/surface/aura-desktop",
]

[profile.dev]
debug = 0

# The terminal UI lays out and draws its whole screen on one thread,
# every frame while anything runs and after every key. Unoptimized, a
# frame of a long session takes ~10 ms and typing lags behind; with the
# dependencies optimized (built once, then cached) and the UI crates at
# opt-level 1 it takes ~2.5 ms, close to a release build, while the UI
# crates still rebuild quickly. `cargo test` builds with this profile too.
[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.aura-ui-terminal]
opt-level = 1

[profile.dev.package.aura-ui]
opt-level = 1

[profile.test]
debug = 0

# Many agents at once spend their time in JSON, SSE parsing and small
# allocations; one codegen unit and thin LTO let those inline across
# crates.
[profile.release]
lto = "thin"
codegen-units = 1

# The same with whole-program LTO, for shipped builds: slower to link.
[profile.release-fast]
inherits = "release"
lto = "fat"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85.0"
license = "MIT"
repository = "https://github.com/aura/aura_os"

[workspace.dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# TUI
ratatui = "0.30"
crossterm = "0.28"

# Hashing
blake3 = "1.5"
zstd = { version = "0.13", default-features = false }
rustc-hash = "2"

# Archives
flate2 = "1"
tar = "0.4"

# YAML
serde_yaml = "0.9"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Async runtime
tokio = { version = "1.35", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }

# HTTP
axum = { version = "0.7", features = ["ws"] }
reqwest = { version = "0.11", features = ["json"] }
tower = { version = "0.5", features = ["util", "limit"] }
tower-http = { version = "0.6", features = ["trace", "cors", "timeout", "limit"] }
tower_governor = { version = "0.5", features = ["axum"] }
governor = "0.8"

# Storage
rocksdb = "0.24"

# Host facts for the HOST tab and cloud nodes (cross-platform: the
# desktop app also runs on Windows and macOS).
sysinfo = { version = "0.33", default-features = false, features = ["system", "disk", "network"] }

# Allocator for the binaries: many threads allocating small strings at once
mimalloc = { version = "0.1", default-features = false }

# Concurrency
dashmap = "5.5"
parking_lot = "0.12"
rayon = "1.10"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Testing
tempfile = "3.10"
proptest = "1.4"
tokio-tungstenite = "0.26"
# Phase 7a: insta snapshot tests for the task-tool SubagentResult
# byte-identical shape pin (json + redactions for non-deterministic
# child agent ids).
insta = { version = "1.40", features = ["json", "redactions"] }

# Time
chrono = { version = "0.4", features = ["serde"] }
# Cron-expression parsing for process schedules (Swarm TEE phase 7).
cron = "0.16"

# UUID
uuid = { version = "1.7", features = ["v4", "serde"] }

# Futures
futures-util = "0.3"

# Bytes
bytes = "1.5"

# Hex encoding
hex = "0.4"

# Base64 encoding
base64 = "0.22"

# Directories
dirs = "5.0"

# Decoding pasted images for their terminal thumbnails
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

# CLI / TTY helpers
colored = "2.1"
rpassword = "7.5"

# Terminal size detection for log wrap
terminal_size = "0.4"

# Environment / config loading
dotenvy = "0.15.7"

# Async traits / utilities
async-trait = "0.1"

# Windows-friendly binary discovery
which = "7"

# Embedded PTY (terminal spawning)
portable-pty = "0.8"

# Linux Landlock LSM (confining command writes to the workspace)
landlock = "0.4"

# Unicode display width
unicode-width = "0.2"

# Syntax highlighting for the terminal UI's file viewer and code blocks.
# Pure-Rust `fancy-regex` engine only (no onig C dependency); two-face
# ships bat's extended syntax set (TOML, TypeScript, Dockerfile, ...).
syntect = { version = "5.3", default-features = false, features = ["parsing", "regex-fancy"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }

# Filesystem traversal / matching
walkdir = "2.5"
ignore = "0.4"
glob = "0.3"
regex = "1.11"

# Config parsing (skills, workflows)
toml = "0.8"

# Cross-platform credential storage (DPAPI / Keychain / libsecret)
keyring = { version = "3", default-features = false, features = [
    "apple-native",
    "windows-native",
    "sync-secret-service",
] }
# Sealed state-at-rest (Swarm TEE upgrade phase 5)
aes-gcm = "0.10"
zeroize = "1"

[dev-dependencies]
aura-app = { path = "crates/surface/aura-app" }
aura-node = { path = "crates/surface/aura-node", features = ["test-support"] }
aura-config = { path = "crates/config/aura-config" }
aura-agent-kernel = { path = "crates/agent/aura-agent-kernel" }
aura-store-db = { path = "crates/store/aura-store-db" }
aura-model = { path = "crates/model/aura-model" }
aura-agent = { path = "crates/agent/aura-agent" }
aura-agent-trace = { path = "crates/agent/aura-agent-trace" }
chrono = { workspace = true }
aura-engine-automaton = { path = "crates/engine/aura-engine-automaton" }
aura-exec-tools = { path = "crates/exec/aura-exec-tools" }
aura-core-protocol = { path = "crates/core/aura-core-protocol" }
aura-core-modes = { path = "crates/core/aura-core-modes" }
aura-store-record = { path = "crates/store/aura-store-record" }
aura-core-types = { path = "crates/core/aura-core-types" }
aura-core-permissions = { path = "crates/core/aura-core-permissions" }
aura-agent-subagent = { path = "crates/agent/aura-agent-subagent" }
# The root binary no longer holds these deps directly (its body
# lives in `aura-cli`), but the legacy
# `tests/proptest_tests.rs`, `tests/e2e_*.rs` integration tests at
# the root harness still consume the agent/terminal/auth surfaces
# directly. Promoting them to dev-deps keeps the binary surface
# slim without dropping the existing test coverage.
aura-auth = { path = "crates/auth/aura-auth" }
aura-ui-terminal = { path = "crates/ui/aura-ui-terminal" }
axum = { workspace = true }
tokio-util = { workspace = true }
parking_lot = { workspace = true }
# Phase 9 golden CLI help-text snapshot test
# (`tests/cli_golden.rs`) uses `insta` to pin the `--help` output
# of every documented `aura ...` subcommand.
insta = { workspace = true }
async-trait = { workspace = true }
serde_json = { workspace = true }
proptest = { workspace = true }
tempfile = { workspace = true }
bytes = { workspace = true }
futures = "0.3"
tokio-tungstenite = { workspace = true }
reqwest = { workspace = true }
futures-util = { workspace = true }
base64 = { workspace = true }
dashmap = { workspace = true }
tower = { workspace = true }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Full `pedantic` / `nursery` groups remain deferred — they produce ~230
# findings across legacy modules that are better addressed by the Wave 6
# module-splits than sprayed with `#[allow]`s. The curated subset below
# is the Wave 4 stretch: each lint is individually enforceable, has few
# findings in the current tree, and catches real bugs.
pedantic = { level = "allow", priority = -1 }
nursery = { level = "allow", priority = -1 }
# Curated pedantic set re-enabled in Wave 4 stretch. Each lint here is
# independently valuable and has zero or near-zero findings after the
# Wave 1–3 cleanups. If a lint starts flaring (>20 findings) during
# Wave 5/6 work, prefer fixing rather than suppressing.
needless_pass_by_value = "warn"
ref_option = "warn"
manual_let_else = "warn"
semicolon_if_nothing_returned = "warn"
map_unwrap_or = "warn"
unnecessary_wraps = "warn"
if_not_else = "warn"
from_iter_instead_of_collect = "warn"
cast_lossless = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_precision_loss = "warn"
cast_sign_loss = "warn"

[lints]
workspace = true
