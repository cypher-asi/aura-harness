# Clippy configuration for the whole workspace.

# No function longer than 50 lines (clippy counts lines of code in the body,
# not blank or comment-only lines). Enforced per crate with
# `#![deny(clippy::too_many_lines)]` and, once every crate is done, through
# `[workspace.lints.clippy]`.
too-many-lines-threshold = 50

# Tests may unwrap and expect; production code may not
# (`clippy::unwrap_used` / `clippy::expect_used` in the workspace lints).
allow-unwrap-in-tests = true
allow-expect-in-tests = true
