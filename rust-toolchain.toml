# Workspace toolchain pin (Phase 1 — aura agent-first refactor).
#
# Target MSRV is `rust-version = "1.85.0"` in the workspace `Cargo.toml`.
# The floor is set by `rocksdb 0.24` / `librocksdb-sys 0.17` and by the
# transitive `ratatui-macros 0.7` dep (pulled in by `ratatui` for the
# TUI surface), which requires `edition2024` — stable only on Rust 1.85+.
#
# We use `channel = "stable"` for local builds; CI's `--msrv` job
# double-checks that the workspace also compiles on 1.85.0.
[toolchain]
channel = "stable"
components = ["rustfmt", "clippy"]
profile = "minimal"
