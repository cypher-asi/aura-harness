[package]
name = "aura-plugin"
description = "Declarative plugin manifest parse + install + cache + marketplace lookup for Aura"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
doctest = false

[dependencies]
aura-plugin-hooks = { path = "../aura-plugin-hooks" }
aura-config = { path = "../../config/aura-config" }
semver = { version = "1.0", features = ["serde"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
walkdir = { workspace = true }
workspace-hack = { version = "0.1", path = "../../../workspace-hack" }

[dev-dependencies]
tempfile = { workspace = true }

# Tiny Rust stdio "MCP server" fixture binaries used by the
# `tests/it/mcp_echo.rs` integration test. Defining them inside this
# crate keeps the test portable across Unix and Windows (no per-OS
# shell script fixtures) and gives the test stable
# `CARGO_BIN_EXE_<name>` env var paths. They are test fixtures, not
# shipped binaries: only the root `aura` package is installed.
[[bin]]
name = "echo_mcp_server"
path = "src/bin/echo_mcp_server.rs"
test = false
doctest = false
bench = false

[[bin]]
name = "silent_mcp_server"
path = "src/bin/silent_mcp_server.rs"
test = false
doctest = false
bench = false

[lints]
workspace = true
