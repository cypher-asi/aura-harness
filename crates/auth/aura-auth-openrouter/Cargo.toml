[package]
name = "aura-auth-openrouter"
description = "OpenRouter sign-in (OAuth PKCE or pasted API key) for Aura"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
aura-core-auth = { path = "../../core/aura-core-auth" }
aura-auth-kit = { path = "../aura-auth-kit" }
async-trait = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Same version as aura-auth-kit; derives a stable subject from a pasted key.
sha2 = "0.10"
url = "2.5"
workspace-hack = { version = "0.1", path = "../../../workspace-hack" }

[dev-dependencies]
axum = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true
