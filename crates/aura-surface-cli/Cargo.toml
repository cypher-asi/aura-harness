[package]
name = "aura-surface-cli"
description = "Phase 9 surface-layer composition root for the aura CLI binary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
aura-core-modes = { path = "../aura-core-modes" }
aura-config = { path = "../aura-config" }
# Phase 10 carve-out 1: the binary body migration moves the full
# `aura` and `aura-node` entrypoint logic into this crate, so we
# now pull in every dep the binaries previously named directly.
aura-core-types = { path = "../aura-core-types" }
aura-terminal = { path = "../aura-terminal" }
aura-agent-kernel = { path = "../aura-agent-kernel" }
aura-store-db = { path = "../aura-store-db" }
aura-model-reasoner = { path = "../aura-model-reasoner" }
aura-tools = { path = "../aura-tools" }
aura-agent = { path = "../aura-agent" }
aura-context-memory = { path = "../aura-context-memory" }
aura-context-skills = { path = "../aura-context-skills" }
aura-auth = { path = "../aura-auth" }
aura-runtime = { path = "../aura-runtime" }
# Phase B / Commit 3: the headless `aura ...` event loop pushes a
# `MemoryTurnObserver` onto the agent loop. The observer moved out of
# `aura-runtime::memory_observer` into the engine crate.
aura-engine = { path = "../aura-engine" }
aura-plugin-core = { path = "../aura-plugin-core" }
clap = { version = "4.5", features = ["derive"] }
thiserror = { workspace = true }
anyhow = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true }
tracing-subscriber = { workspace = true }
tracing = { workspace = true }
colored = { workspace = true }
rpassword = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
tokio-util = { workspace = true }
async-trait = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tower = { workspace = true }

[lints]
workspace = true
