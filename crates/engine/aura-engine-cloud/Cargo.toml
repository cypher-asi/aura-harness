[package]
name = "aura-engine-cloud"
description = "Cloud agents on boxd machines: the boxd gRPC client, the machine fleet, snapshots, the mesh and the record mirror"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
aura-config = { path = "../../config/aura-config" }
aura-core-types = { path = "../../core/aura-core-types" }
aura-core-protocol = { path = "../../core/aura-core-protocol" }
async-trait = { workspace = true }
blake3 = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
flate2 = { workspace = true }
futures-util = { workspace = true }
hex = { workspace = true }
parking_lot = { workspace = true }
prost = "0.13"
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sysinfo = { workspace = true }
tar = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tonic = { version = "0.12", default-features = false, features = ["transport", "codegen", "prost", "tls", "tls-webpki-roots"] }
tracing = { workspace = true }
uuid = { workspace = true }
zeroize = { workspace = true }

[build-dependencies]
protox = "0.7"
tonic-build = { version = "0.12", default-features = false, features = ["prost", "transport"] }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
