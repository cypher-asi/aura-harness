[package]
name = "aura-engine-cloud"
description = "Cloud agents on boxd machines: the boxd gRPC client, the machine fleet, snapshots, the mesh, the record mirror and the cloud hub"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
doctest = false

[dependencies]
aura-agent = { path = "../../agent/aura-agent" }
aura-agent-kernel = { path = "../../agent/aura-agent-kernel" }
aura-agent-trace = { path = "../../agent/aura-agent-trace" }
aura-auth = { path = "../../auth/aura-auth" }
aura-config = { path = "../../config/aura-config" }
aura-core-types = { path = "../../core/aura-core-types" }
aura-core-auth = { path = "../../core/aura-core-auth" }
aura-core-protocol = { path = "../../core/aura-core-protocol" }
aura-engine = { path = "../aura-engine" }
aura-exec-tools = { path = "../../exec/aura-exec-tools" }
# The merge queue target a new machine pulls (`resolve_target`); already in
# the tree through aura-exec-tools.
aura-exec-merge-queue = { path = "../../exec/aura-exec-merge-queue" }
aura-store-db = { path = "../../store/aura-store-db" }
async-trait = { workspace = true }
blake3 = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
flate2 = { workspace = true }
futures-util = { workspace = true }
hex = { workspace = true }
jsonwebtoken = { workspace = true }
parking_lot = { workspace = true }
prost = "0.13"
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sysinfo = { workspace = true }
tar = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
# The hub drives each node's run stream and mesh socket.
tokio-tungstenite = { workspace = true, features = ["rustls-tls-webpki-roots"] }
tonic = { version = "0.12", default-features = false, features = ["transport", "codegen", "prost", "tls", "tls-webpki-roots"] }
tracing = { workspace = true }
uuid = { workspace = true }
which = { workspace = true }
zeroize = { workspace = true }
workspace-hack = { version = "0.1", path = "../../../workspace-hack" }

[build-dependencies]
protox = "0.7"
tonic-build = { version = "0.12", default-features = false, features = ["prost", "transport"] }

[dev-dependencies]
axum = { workspace = true }

# Only the gRPC client tonic-build generates into OUT_DIR uses prost,
# and cargo-machete reads only the crate's own sources.
[package.metadata.cargo-machete]
ignored = ["prost"]

[lints]
workspace = true
