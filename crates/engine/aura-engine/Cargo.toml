[package]
name = "aura-engine"
description = "Aura runtime orchestration engine — scheduler, worker, agent host, automaton bridge, memory observer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
doctest = false

[dependencies]
aura-core-types = { path = "../../core/aura-core-types" }
aura-core-protocol = { path = "../../core/aura-core-protocol" }
aura-store-db = { path = "../../store/aura-store-db" }
aura-store-snapshot = { path = "../../store/aura-store-snapshot" }
aura-exec-tools = { path = "../../exec/aura-exec-tools" }
aura-model = { path = "../../model/aura-model" }
aura-agent-kernel = { path = "../../agent/aura-agent-kernel" }
aura-agent = { path = "../../agent/aura-agent" }
aura-agent-subagent = { path = "../../agent/aura-agent-subagent" }
aura-context-memory = { path = "../../context/aura-context-memory" }
aura-engine-automaton = { path = "../aura-engine-automaton" }
# Phase C / Commit 4: the JWT-injecting `DomainApi` wrapper moved
# into `aura-exec-domain-http` alongside the HTTP impl. The automaton
# bridge imports `JwtDomainApi` from there.
aura-exec-domain-http = { path = "../../exec/aura-exec-domain-http" }
thiserror = { workspace = true }
serde_json = { workspace = true }
bytes = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
dashmap = { workspace = true }
parking_lot = { workspace = true }
tokio-util = { workspace = true }
workspace-hack = { version = "0.1", path = "../../../workspace-hack" }

[dev-dependencies]
tempfile = { workspace = true }
insta = { workspace = true }

[lints]
workspace = true
