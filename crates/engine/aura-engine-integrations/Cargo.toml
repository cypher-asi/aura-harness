[package]
name = "aura-engine-integrations"
description = "The standard way to plug an external service into aura: manifest, credentials, status, health check, agent tools and access"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
doctest = false

[dependencies]
aura-core-types = { path = "../../core/aura-core-types" }
aura-exec-tools = { path = "../../exec/aura-exec-tools" }
# Sealing stored credentials: the AES-256-GCM `SealCipher` of the local
# store (#93), under the local store's own key.
aura-store-db = { path = "../../store/aura-store-db" }
async-trait = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
zeroize = { workspace = true }
workspace-hack = { version = "0.1", path = "../../../workspace-hack" }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
