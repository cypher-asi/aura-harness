[package]
name = "aura-exec-tools"
description = "Tool executor and registry for filesystem and command operations"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
doctest = false

[dependencies]
aura-core-types = { path = "../../core/aura-core-types" }
aura-exec-traits = { path = "../aura-exec-traits" }
# Push results carry the merge queue's `QueuedPush` marker.
aura-exec-merge-queue = { path = "../aura-exec-merge-queue" }
# `permissions` reads `Identity` records off the per-agent log through
# the backend-neutral `ReadStore`.
aura-store-record = { path = "../../store/aura-store-record" }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
glob = { workspace = true }
ignore = { workspace = true }
rayon = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true, features = ["stream"] }
similar = "2"
toml = { workspace = true }
which = { workspace = true }
futures-util = { workspace = true }
uuid = { workspace = true }
# Timestamps on plans (`plan_tools::origin`)
chrono = { workspace = true }
portable-pty = { workspace = true }
workspace-hack = { version = "0.1", path = "../../../workspace-hack" }

[target.'cfg(target_os = "linux")'.dependencies]
landlock = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
