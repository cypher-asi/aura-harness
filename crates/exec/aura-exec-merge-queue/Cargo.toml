[package]
name = "aura-exec-merge-queue"
description = "Per-repo merge queue: every aura push lands on main one at a time, rebased and checked"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
async-trait = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }

# The OS file locks of the queue (`flock`), and killing a timed-out
# check's whole process group. Already in the tree through aura-app.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", default-features = false, features = ["std", "fs", "process"] }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
