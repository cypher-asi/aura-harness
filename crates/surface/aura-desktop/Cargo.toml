[package]
name = "aura-desktop"
description = "The AURA terminal UI in a native GPU window, drawn with wgpu"
version.workspace = true
edition.workspace = true
# wgpu 27 needs Rust 1.88; the rest of the workspace keeps the 1.85 floor.
rust-version = "1.88"
license.workspace = true
publish = false

[[bin]]
name = "aura-desktop"
path = "src/main.rs"

[dependencies]
aura-ui = { path = "../../ui/aura-ui" }
aura-app = { path = "../aura-app" }
aura-core-modes = { path = "../../core/aura-core-modes" }
aura-ui-terminal = { path = "../../ui/aura-ui-terminal" }

ratatui = { workspace = true }
crossterm = { workspace = true }
unicode-width = { workspace = true }
# Text, drawn shapes, the GPU, the window, and the window's pixels where
# there is no GPU.
cosmic-text = "0.15"
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
wgpu = { version = "27", default-features = false, features = ["std", "parking_lot", "wgsl", "vulkan", "gles", "metal", "dx12"] }
winit = "0.30"
softbuffer = { version = "0.4", default-features = false, features = ["x11", "x11-dlopen", "wayland", "wayland-dlopen"] }
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
# Hashes every row and run drawn each frame, faster than the default
rustc-hash = { workspace = true }

anyhow = { workspace = true }
chrono = { workspace = true }
clap = { version = "4.5", features = ["derive"] }
aura-config = { path = "../../config/aura-config" }
futures = "0.3"
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
