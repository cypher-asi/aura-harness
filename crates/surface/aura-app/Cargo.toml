[package]
name = "aura-app"
description = "Agent session host shared by the aura terminal, desktop app and `aura -p`"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
aura-core-modes = { path = "../../core/aura-core-modes" }
aura-config = { path = "../../config/aura-config" }
aura-core-types = { path = "../../core/aura-core-types" }
aura-ui = { path = "../../ui/aura-ui" }
aura-agent-kernel = { path = "../../agent/aura-agent-kernel" }
aura-store-db = { path = "../../store/aura-store-db" }
aura-store-record = { path = "../../store/aura-store-record" }
aura-store-snapshot = { path = "../../store/aura-store-snapshot" }
aura-model = { path = "../../model/aura-model" }
aura-exec-tools = { path = "../../exec/aura-exec-tools" }
aura-exec-merge-queue = { path = "../../exec/aura-exec-merge-queue" }
aura-agent = { path = "../../agent/aura-agent" }
aura-agent-trace = { path = "../../agent/aura-agent-trace" }
aura-gate = { path = "../../gate/aura-gate" }
aura-context-memory = { path = "../../context/aura-context-memory" }
aura-context-prompts = { path = "../../context/aura-context-prompts" }
aura-context-skills = { path = "../../context/aura-context-skills" }
aura-auth = { path = "../../auth/aura-auth" }
aura-auth-kit = { path = "../../auth/aura-auth-kit" }
aura-engine = { path = "../../engine/aura-engine" }
aura-engine-cloud = { path = "../../engine/aura-engine-cloud" }
aura-engine-integrations = { path = "../../engine/aura-engine-integrations" }
aura-engine-registry = { path = "../../engine/aura-engine-registry" }
aura-core-auth = { path = "../../core/aura-core-auth" }
aura-core-protocol = { path = "../../core/aura-core-protocol" }
thiserror = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
rayon = { workspace = true }
tracing-subscriber = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
tokio-util = { workspace = true }
futures-util = { workspace = true }
async-trait = { workspace = true }
dirs = { workspace = true }
blake3 = { workspace = true }
dhat = { version = "0.3", optional = true }
bytes = { workspace = true }
similar = "2"
tempfile = { workspace = true }
toml = { workspace = true }
reqwest = { workspace = true }
flate2 = { workspace = true }
tar = { workspace = true }
walkdir = { workspace = true }
parking_lot = { workspace = true }
which = { workspace = true }
# Zeroizes the local store's key once its cipher is built.
zeroize = { workspace = true }

# Lowers the agents' threads below the UI's (`priority`).
[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1", default-features = false, features = ["std", "process", "thread"] }

[build-dependencies]
walkdir = { workspace = true }

[features]
# Heap-profile the load harness (`event_loop/tests/load/heap.rs`); test
# builds only, as it replaces the allocator.
dhat-heap = ["dep:dhat"]

[dev-dependencies]
# `test-support` lets the local store's tests stop a migration midway.
aura-store-db = { path = "../../store/aura-store-db", features = ["test-support"] }
# `test-support` lets the app's tests fill Gate's table by hand.
aura-gate = { path = "../../gate/aura-gate", features = ["test-support"] }
# `test-support` lets the app's tests read the registry's store.
aura-engine-registry = { path = "../../engine/aura-engine-registry", features = ["test-support"] }
# `test-support` lets the hub's end-to-end tests reach into the hub.
aura-engine-cloud = { path = "../../engine/aura-engine-cloud", features = ["test-support"] }
# `test-support` serves a claimed cloud node in-process for the hub's
# client tests.
aura-node = { path = "../aura-node", features = ["test-support"] }
tower = { workspace = true }
# The load harness runs the real terminal UI on a test screen.
aura-ui-terminal = { path = "../../ui/aura-ui-terminal" }
ratatui = { workspace = true }
# `test-util` enables tokio's paused-clock test helpers
# (`#[tokio::test(start_paused = true)]`), so the shutdown-grace tests of
# `session::SessionTask::finish` run without real waits. Tests only; the
# production build is unaffected.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
