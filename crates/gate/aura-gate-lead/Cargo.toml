[package]
name = "aura-gate-lead"
description = "Gate: what the lead agent may do itself while delegation is enforced, and how much of its work went to subtasks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
aura-agent = { path = "../../agent/aura-agent" }
aura-config = { path = "../../config/aura-config" }
aura-core-types = { path = "../../core/aura-core-types" }
aura-gate-evidence = { path = "../aura-gate-evidence" }
aura-gate-route = { path = "../aura-gate-route" }
aura-model = { path = "../../model/aura-model" }
async-trait = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# The way tests fill their tables with `test-support`'s builder.
aura-gate-route = { path = "../aura-gate-route", features = ["test-support"] }
tokio = { workspace = true }

[lints]
workspace = true
